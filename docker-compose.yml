services:
  db:
    image: postgres:16-alpine
    container_name: vise-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      # Puerto del host separado para no chocar con un Postgres local
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # El backend esperará a que la BD esté 'healthy' antes de arrancar
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./inventario/backend
    container_name: vise-backend
    restart: unless-stopped
    init: true # proceso init mínimo: reenvía señales y recoge procesos zombie
    env_file: .env
    environment:
      # Dentro de la red de Compose la BD se resuelve por nombre de servicio
      DB_HOST: db
      DB_PORT: 5432
      PORT: 3000
      NODE_ENV: production
    ports:
      - "${API_HOST_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # El frontend (Bloque 6) esperará a que la API responda
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build: ./inventario/frontend
    container_name: vise-frontend
    restart: unless-stopped
    ports:
      - "${WEB_HOST_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- Parte 2: RPA ----------
  antecedentes-mock:
    build: ./rpa/mock_service
    container_name: vise-antecedentes-mock
    restart: unless-stopped
    environment:
      FAILURE_RATE: ${MOCK_FAILURE_RATE:-0.1}
    ports:
      - "${MOCK_HOST_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Proceso batch: se ejecuta una vez con `docker compose up` y termina (exit 0).
  # Para repetirlo: docker compose run --rm rpa
  rpa:
    build: ./rpa
    container_name: vise-rpa
    environment:
      ANTECEDENTES_SERVICE_URL: http://antecedentes-mock:8000
      RPA_TIMEOUT_S: ${RPA_TIMEOUT_S:-3}
      RPA_MAX_REINTENTOS: ${RPA_MAX_REINTENTOS:-3}
      RPA_ENMASCARAR_LOGS: ${RPA_ENMASCARAR_LOGS:-true}
    volumes:
      - ./rpa/data:/app/data:ro # entrada: reemplaza cedulas.xlsx sin reconstruir la imagen
      - ./rpa/output:/app/output # salida: reporte_antecedentes.xlsx
      - ./rpa/logs:/app/logs # un log por ejecución
    depends_on:
      antecedentes-mock:
        condition: service_healthy

volumes:
  pgdata:
