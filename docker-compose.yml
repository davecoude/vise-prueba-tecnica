services:
  db:
    image: postgres:16-alpine
    container_name: vise-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      # Puerto del host separado para no chocar con un Postgres local
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # El backend esperará a que la BD esté 'healthy' antes de arrancar
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./inventario/backend
    container_name: vise-backend
    restart: unless-stopped
    init: true # proceso init mínimo: reenvía señales y recoge procesos zombie
    env_file: .env
    environment:
      # Dentro de la red de Compose la BD se resuelve por nombre de servicio
      DB_HOST: db
      DB_PORT: 5432
      PORT: 3000
      NODE_ENV: production
    ports:
      - "${API_HOST_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # El frontend (Bloque 6) esperará a que la API responda
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pgdata:
