server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Cabeceras de seguridad (se definen solo aquí: un add_header dentro de un
  # location anularía la herencia de estas)
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Reverse proxy: el navegador habla con un solo origen → sin CORS
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Archivos con hash en el nombre: caché de larga duración
  location /assets/ {
    expires 1y;
  }

  # SPA: cualquier ruta del cliente (/productos/5) sirve index.html, siempre revalidado
  location / {
    expires -1;
    try_files $uri $uri/ /index.html;
  }
}
